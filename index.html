
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceci est un texte</title>

<style>
body {
  margin: 0;
  background: #fff;
  color: #202122;
  font-family: Arial, sans-serif;
  line-height: 1.7;
}

main {
  max-width: 820px;
  margin: 45px auto;
  padding: 0 24px;
}

h1 {
  font-family: Georgia, serif;
  font-size: 2.2rem;
  font-weight: normal;
  border-bottom: 1px solid #a2a9b1;
  padding-bottom: 12px;
}

p {
  font-size: 17px;
}

.author {
  margin-top: 35px;
  font-style: italic;
}

/* Image and caption */
.article-figure {
  float: right;
  width: 220px;
  margin: 5px 0 20px 25px;
  border: 1px solid #a2a9b1;
  padding: 4px;
  background: #f8f9fa;
}

.article-image {
  display: block;
  width: 100%;
  height: auto;
}

.caption {
  font-size: 13px;
  line-height: 1.4;
  text-align: center;
  margin: 6px 3px 4px;
  color: #54595d;
}

/* Mobile display */
@media (max-width: 600px) {
  main {
    margin: 20px auto;
    padding: 0 18px;
  }

  h1 {
    font-size: 1.8rem;
  }

  .article-figure {
    width: 130px;
  }
}
</style>
</head>

<body>
<main>

  <h1>Ceci est un texte</h1>

  <figure class="article-figure">
    <img src="Qin%20Shihuang.png"
         alt="Qin Shihuang"
         class="article-image">
    <figcaption class="caption">
      Qin Shi Huang, premier empereur de Chine
    </figcaption>
  </figure>

  <p>
    Bonjour à tous voilà un texte très gentil
    pour tester la fonctionnalité.
  </p>

  <p>Merci</p>

  <p class="author">Emmanuel Macron</p>

</main>
</body>
</html>
